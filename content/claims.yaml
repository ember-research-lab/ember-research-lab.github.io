# Claims ledger. Rule: every row has a `source` pointing at an existing tier-tagged line;
# `tier` is copied verbatim from that line. No source -> no row. Never raise a tier.
# source.ref: lean_readme (fetched + verified at build time) | rigor (RIGOROUS_WORKFLOW.md, lab protocol;
# verified only when the lab workspace copy is present, otherwise reported as not re-verified).
# Allowed tiers: T0 T1 T2 T3 CLOSED CONDITIONAL OPEN STOPPED, plus the verdict words DEGENERATE and NO
# that the Lean README itself uses for negative results.
# `quote` must occur verbatim in the source; the tier tag must occur in the quoted line (or, if the line
# carries none, in the nearest "Tier N" heading above it).
