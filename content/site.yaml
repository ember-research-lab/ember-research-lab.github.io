glossary:
  - {term: Graph Laplacian, def: "For a weighted graph, the operator L = D - W (degree minus weights). Self-adjoint and positive semi-definite; constants lie in its kernel. The framework takes L as the basic observable.", status: definition}
  - {term: Spectral gap, def: "The smallest nonzero eigenvalue of L. Larger means the graph is more tightly connected.", status: definition, claim: lattice-gap}
  - {term: Heat kernel, def: "exp(-tL): real exponentiation of L. Positivity-preserving and dissipative; the framework reads geometry from it.", status: definition}
  - {term: Propagator, def: "exp(-itL): imaginary exponentiation of L. Unitary.", status: definition}
  - {term: Trace, def: "Tr g(L) = sum of g over the eigenvalues; a global scalar that needs the whole spectrum. The framework calls it self-referential.", status: definition}
  - {term: Three projections, def: "The heat kernel, the propagator, and the trace, as the framework's three primitive operations on L. That they generate the rest of the functional calculus is a framework claim, not rated here.", status: unrated}
  - {term: Bakry-Emery condition, def: "A lower bound on graph curvature via the carre-du-champ calculus; implies a Lichnerowicz-type bound on the spectral gap.", status: definition, claim: bakry-emery}
  - {term: Cayley-Dickson tower, def: "The doubling construction reals, complex, quaternions, octonions, and beyond.", status: definition, claim: cayley-dickson}
  - {term: Self-referential closure (Axiom 3), def: "The posit that the system's observations can represent their own observations. A posit of the framework, not a theorem.", status: unrated}
  - {term: Predicate hypothesis, def: "Open mathematical content carried as a named proposition P in theorems of the form P implies Q, so the theorem never asserts P itself.", status: definition}
  - {term: Honest negative, def: "A result that a hypothesis fails or a route does not close, recorded as a theorem or table row rather than dropped.", status: definition}
  - {term: C-kappa landscape, def: "The alignment preprint's proposed two-parameter description of self-modelling systems: modelling depth C and substrate coupling kappa. Neither is operationalised as a measurement yet.", status: conjectural}
  - {term: "Host, stand-in, forget step", def: "For any claim about a physical object (host) computed on a simpler model (stand-in), the claim carries at most the tier of the forgetting step between them.", status: definition}
tiers:
  - {tag: T1, meaning: "Proved. In Lean: no sorry, and only mathlib's foundational axioms."}
  - {tag: T2, meaning: "Proved conditional on cited, non-vacuous literature results."}
  - {tag: T3, meaning: "Conjectural or posited. Nothing at T1 or T2 may rely on it."}
  - {tag: T0, meaning: "Trivially true; a placeholder, not evidence."}
  - {tag: "CLOSED / CONDITIONAL / OPEN / STOPPED", meaning: "Status words for a line of work: settled, settled given stated hypotheses, unresolved, abandoned with the reason recorded."}
  - {tag: "NO / DEGENERATE", meaning: "Verdicts the Lean repository uses for negative results."}
